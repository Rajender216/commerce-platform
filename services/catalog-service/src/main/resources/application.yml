spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog_service}
    username: ${CATALOG_DATASOURCE_USERNAME:catalog_service}
    password: ${CATALOG_DATASOURCE_PASSWORD:catalog_service}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

catalog:
  correlation:
    header-name: X-Correlation-ID
    max-length: 128

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
