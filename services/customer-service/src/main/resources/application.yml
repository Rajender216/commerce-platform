spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/customer_service}
    username: ${CUSTOMER_DATASOURCE_USERNAME:customer_service}
    password: ${CUSTOMER_DATASOURCE_PASSWORD:customer_service}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CUSTOMER_SECURITY_ISSUER_URI:http://localhost:8081/realms/commerce-mvp}
          jwk-set-uri: ${CUSTOMER_SECURITY_JWK_SET_URI:http://localhost:8081/realms/commerce-mvp/protocol/openid-connect/certs}

customer:
  correlation:
    header-name: X-Correlation-ID
    max-length: 128

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    metadata-map:
      management.context-path: /actuator

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8082
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
